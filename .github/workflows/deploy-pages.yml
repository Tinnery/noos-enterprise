name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "index.md"
      - "dashboard/**"
      - "explorations/**"
      - "templates/**"
      - "README.md"
      - "VISION.md"
      - "AGENTS.md"
      - ".github/workflows/deploy-pages.yml"
  pull_request:
    branches:
      - main
    paths:
      - "index.md"
      - "dashboard/**"
      - "explorations/**"
      - "templates/**"
      - "README.md"
      - "VISION.md"
      - "AGENTS.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  test-detectors:
    name: Test Signal Detectors
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy networkx

      - name: Run detector tests
        working-directory: explorations/0002-signal-detection-community-intelligence/scripts
        run: python test_detectors.py

  build:
    name: Build Research Portal
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install site dependencies
        working-directory: dashboard
        run: npm install --no-audit --no-fund

      - name: Build static site
        working-directory: dashboard
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
